# Every commit in a pull request must carry a Signed-off-by line matching its own
# author — the Developer Certificate of Origin. CONTRIBUTING.md tells contributors
# this check exists and that a pull request without it fails; this is that check.
#
# It reads the commits with git rather than calling a third-party action, so the
# gate adds no dependency to audit or pin.

name: dco

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Every commit carries a sign-off matching its author
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          missing=0
          while read -r sha; do
            # A merge commit is generated by git, not written by an author, so it
            # carries no trailer and none is expected. Two parents means merge.
            if [ "$(git rev-list --parents -n 1 "$sha" | wc -w)" -gt 2 ]; then
              continue
            fi
            # No pipe into grep here, deliberately: this step runs under `pipefail`,
            # where `git show | grep -q` returns git's SIGPIPE status (141) once grep
            # exits early — which would report a correctly signed commit as missing.
            author="$(git show -s --format='%an <%ae>' "$sha")"
            signoffs="$(git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha")"
            if [[ "${signoffs,,}" != *"${author,,}"* ]]; then
              echo "::error::$(git show -s --format='%h %s' "$sha") — missing: Signed-off-by: $author"
              missing=$((missing + 1))
            fi
          done < <(git rev-list "$BASE"..HEAD)

          if [ "$missing" -gt 0 ]; then
            echo
            echo "$missing commit(s) carry no Signed-off-by line matching their author."
            echo "Add it to new commits with:  git commit -s"
            echo "Add it to commits already made with:  git rebase --signoff $BASE"
            exit 1
          fi
          echo "Every commit carries a Signed-off-by line matching its author."
